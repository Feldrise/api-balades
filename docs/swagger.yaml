basePath: /api/v1
definitions:
  AdminParticipantUpdatePayload:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      price_label:
        type: string
    type: object
  AdminReservationListResponse:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      reservations:
        items:
          $ref: '#/definitions/Reservation'
        type: array
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  AdminReservationStatusUpdatePayload:
    properties:
      reason:
        type: string
      send_email:
        description: Whether to send the reservation summary to the booker
        type: boolean
      status:
        type: string
    type: object
  AuthenticatePostPayload:
    properties:
      email:
        description: the user's email
        example: admin@feldrise.com
        type: string
      first_name:
        description: the user's first name
        example: Victor
        type: string
      last_name:
        description: the user's last name
        example: DENIS
        type: string
      phone:
        description: the user's phone
        example: "+33612345678"
        type: string
    required:
    - email
    type: object
  BulkReservationActionError:
    properties:
      error:
        type: string
      reservation_id:
        type: integer
    type: object
  BulkReservationActionPayload:
    properties:
      action:
        description: '"confirm", "cancel", "move_to_waiting", "delete"'
        type: string
      reason:
        type: string
      reservation_ids:
        items:
          type: integer
        type: array
      send_email:
        description: Whether to send the reservation summary to the bookers
        type: boolean
    type: object
  BulkReservationActionResult:
    properties:
      errors:
        items:
          $ref: '#/definitions/BulkReservationActionError'
        type: array
      failure_count:
        type: integer
      success_count:
        type: integer
      updated:
        items:
          $ref: '#/definitions/Reservation'
        type: array
    type: object
  ErrResponse:
    properties:
      code:
        description: application-specific error code
        type: integer
      error:
        description: application-level error message, for debugging
        type: string
      reason:
        description: machine-readable business error, for clients to react to
        type: string
      status:
        description: user-level status message
        type: string
    type: object
  Guide:
    properties:
      avatar:
        type: string
      bio:
        type: string
      certification_level:
        type: string
      created_at:
        type: string
      email:
        type: string
      emergency_contact_name:
        type: string
      emergency_contact_phone:
        type: string
      experience:
        type: string
      first_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      languages:
        type: string
      last_name:
        type: string
      payment_enabled:
        type: boolean
      phone:
        type: string
      specialties:
        type: string
      stripe_account_id:
        description: Payment configuration (sensitive fields excluded for security)
        type: string
      stripe_public_key:
        type: string
      updated_at:
        type: string
    type: object
  GuideCreatePayload:
    properties:
      avatar_base64:
        description: Base64 encoded image
        type: string
      bio:
        type: string
      certification_level:
        type: string
      email:
        type: string
      emergency_contact_name:
        type: string
      emergency_contact_phone:
        type: string
      experience:
        type: string
      first_name:
        type: string
      languages:
        type: string
      last_name:
        type: string
      phone:
        type: string
      specialties:
        type: string
    required:
    - email
    - first_name
    - last_name
    type: object
  GuideLinkUserPayload:
    properties:
      user_id:
        type: integer
    required:
    - user_id
    type: object
  GuidePaymentConfigPayload:
    properties:
      payment_enabled:
        type: boolean
      stripe_account_id:
        type: string
      stripe_public_key:
        type: string
      stripe_secret_key:
        type: string
      stripe_webhook_secret:
        type: string
    type: object
  Participant:
    properties:
      first_name:
        type: string
      id:
        type: integer
      is_booker:
        type: boolean
      last_name:
        type: string
      price_amount:
        description: PriceAmount is the amount in euros of the participant's price,
          0 when the price is missing.
        type: number
      price_label:
        type: string
      price_missing:
        description: |-
          PriceMissing tells that the ramble has prices but the participant's is
          unknown, as for participants migrated from a ramble with several prices.
        type: boolean
    type: object
  ParticipantPayload:
    properties:
      first_name:
        type: string
      is_booker:
        type: boolean
      last_name:
        type: string
      price_label:
        type: string
    type: object
  ParticipantUpdatePayload:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      price_label:
        type: string
    type: object
  ParticipantsAddPayload:
    properties:
      participants:
        items:
          $ref: '#/definitions/ParticipantPayload'
        type: array
    type: object
  Payment:
    properties:
      amount:
        description: Payment details
        type: integer
      created_at:
        type: string
      currency:
        description: Currency code
        type: string
      failure_reason:
        description: Reason for payment failure
        type: string
      group_id:
        type: integer
      guide:
        allOf:
        - $ref: '#/definitions/Guide'
        description: Foreign Objects
      guide_id:
        description: Guide receiving payment
        type: integer
      id:
        type: integer
      paid_at:
        description: Timestamps
        type: string
      payer_email:
        description: Payer information
        type: string
      payer_name:
        type: string
      payment_method:
        description: card, sepa, etc.
        type: string
      refund_amount:
        description: Amount refunded in cents
        type: integer
      refunded_at:
        type: string
      registration_id:
        description: Legacy registration relationship
        type: integer
      reservation_id:
        description: Reservation relationship
        type: integer
      status:
        description: pending, succeeded, failed, cancelled, refunded
        type: string
      stripe_charge_id:
        type: string
      stripe_payment_intent_id:
        description: Stripe identifiers
        type: string
      updated_at:
        type: string
    type: object
  PaymentRefundPayload:
    properties:
      amount:
        description: Amount to refund in cents, if nil refunds full amount
        type: integer
      reason:
        description: Reason for refund
        type: string
    type: object
  PaymentResponse:
    properties:
      client_secret:
        description: Stripe client secret for frontend
        type: string
      payment:
        $ref: '#/definitions/Payment'
      publishable_key:
        description: Stripe publishable key for frontend
        type: string
    type: object
  Ramble:
    properties:
      additional_documents_url:
        type: string
      cancellation_date:
        type: string
      cancellation_reason:
        type: string
      cover_image:
        type: string
      created_at:
        type: string
      date:
        type: string
      description:
        type: string
      difficulty:
        type: string
      equipment_needed:
        type: string
      estimated_duration:
        description: store as HH:MM:SS
        type: string
      guides:
        items:
          $ref: '#/definitions/Guide'
        type: array
      id:
        type: integer
      is_cancelled:
        type: boolean
      location:
        type: string
      max_participants:
        type: integer
      max_participants_per_reservation:
        description: MaxParticipantsPerReservation is the capacity, or a safeguard
          when the ramble is unlimited.
        type: integer
      meeting_latitude:
        type: number
      meeting_longitude:
        type: number
      meeting_point:
        type: string
      payment_enabled:
        type: boolean
      payment_guide:
        $ref: '#/definitions/Guide'
      payment_guide_id:
        description: Payment fields
        type: integer
      payment_required:
        type: boolean
      places_left:
        type: integer
      prerequisites:
        type: string
      prices:
        items:
          $ref: '#/definitions/model.RamblePrice'
        type: array
      published_at:
        type: string
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  RambleCancelPayload:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  RambleCreatePayload:
    properties:
      additional_document_base64:
        description: Base64 encoded document
        type: string
      cover_image_base64:
        description: Base64 encoded cover image
        type: string
      date:
        type: string
      description:
        type: string
      difficulty:
        type: string
      equipment_needed:
        type: string
      estimated_duration:
        description: store as HH:MM:SS
        type: string
      guide_ids:
        description: Array of guide IDs
        items:
          type: integer
        type: array
      is_draft:
        type: boolean
      location:
        type: string
      max_participants:
        type: integer
      meeting_latitude:
        type: number
      meeting_longitude:
        type: number
      meeting_point:
        type: string
      payment_enabled:
        type: boolean
      payment_guide_id:
        description: Payment fields
        type: integer
      payment_required:
        type: boolean
      prerequisites:
        type: string
      prices:
        items:
          $ref: '#/definitions/model.RamblePrice'
        type: array
      published_at:
        type: string
      title:
        type: string
      type:
        type: string
    required:
    - difficulty
    - prices
    - title
    - type
    type: object
  RambleDuplicatePayload:
    properties:
      date:
        type: string
      title:
        type: string
    type: object
  Reservation:
    properties:
      amount_due:
        description: 'AmountDue is the amount in cents left to pay: EstimatedAmount
          minus AmountPaid, never below zero.'
        type: integer
      amount_paid:
        description: 'AmountPaid is the amount in cents paid and kept: the payments
          succeeded minus their refunds.'
        type: integer
      cancellation_date:
        type: string
      cancellation_reason:
        type: string
      confirmation_date:
        type: string
      confirmation_deadline:
        type: string
      contact_email:
        type: string
      created_at:
        type: string
      estimated_amount:
        description: EstimatedAmount is the amount in cents computed from the participants'
          known prices.
        type: integer
      has_missing_prices:
        description: |-
          HasMissingPrices tells that a participant's price is unknown, so that
          EstimatedAmount is incomplete.
        type: boolean
      has_successful_payment:
        description: |-
          HasSuccessfulPayment tells that an amount paid is kept (a payment succeeded
          and not entirely refunded): after a removal or a cancellation, the booker
          is invited to contact the guide for a refund.
        type: boolean
      id:
        type: integer
      participants:
        items:
          $ref: '#/definitions/Participant'
        type: array
      payments:
        items:
          $ref: '#/definitions/ReservationPayment'
        type: array
      ramble:
        $ref: '#/definitions/ReservationRamble'
      ramble_id:
        type: integer
      status:
        description: pending, confirmed, waiting_list, cancelled
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  ReservationCreatePayload:
    properties:
      contact_email:
        type: string
      contact_phone:
        type: string
      participants:
        items:
          $ref: '#/definitions/ParticipantPayload'
        type: array
      ramble_id:
        type: integer
    type: object
  ReservationPayment:
    properties:
      amount:
        description: Amount is in cents.
        type: integer
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      paid_at:
        type: string
      refund_amount:
        type: integer
      refunded_at:
        type: string
      status:
        description: pending, requires_action, succeeded, failed, cancelled, partially_refunded,
          refunded
        type: string
    type: object
  ReservationRamble:
    properties:
      date:
        type: string
      location:
        type: string
      title:
        type: string
    type: object
  ReservationWithPayment:
    properties:
      amount_due:
        description: 'AmountDue is the amount in cents left to pay: EstimatedAmount
          minus AmountPaid, never below zero.'
        type: integer
      amount_paid:
        description: 'AmountPaid is the amount in cents paid and kept: the payments
          succeeded minus their refunds.'
        type: integer
      cancellation_date:
        type: string
      cancellation_reason:
        type: string
      confirmation_date:
        type: string
      confirmation_deadline:
        type: string
      contact_email:
        type: string
      created_at:
        type: string
      estimated_amount:
        description: EstimatedAmount is the amount in cents computed from the participants'
          known prices.
        type: integer
      has_missing_prices:
        description: |-
          HasMissingPrices tells that a participant's price is unknown, so that
          EstimatedAmount is incomplete.
        type: boolean
      has_successful_payment:
        description: |-
          HasSuccessfulPayment tells that an amount paid is kept (a payment succeeded
          and not entirely refunded): after a removal or a cancellation, the booker
          is invited to contact the guide for a refund.
        type: boolean
      id:
        type: integer
      participants:
        items:
          $ref: '#/definitions/Participant'
        type: array
      payment:
        $ref: '#/definitions/PaymentResponse'
      payment_unavailable:
        description: |-
          PaymentUnavailable tells that the change is saved but the payment could not
          be prepared: it is to be made later, by confirming the reservation again.
        type: boolean
      payments:
        items:
          $ref: '#/definitions/ReservationPayment'
        type: array
      ramble:
        $ref: '#/definitions/ReservationRamble'
      ramble_id:
        type: integer
      status:
        description: pending, confirmed, waiting_list, cancelled
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  VerifyAuthenticatePostPayload:
    properties:
      code:
        description: the verification code
        example: "123456"
        type: string
      email:
        description: the user's email
        example: admin@feldrise.com
        type: string
    required:
    - code
    - email
    type: object
  model.RamblePrice:
    properties:
      amount:
        type: number
      label:
        type: string
    type: object
  model.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      permissions:
        items:
          type: string
        type: array
      profile:
        $ref: '#/definitions/model.UserProfile'
      roles:
        items:
          type: string
        type: array
    type: object
  model.UserProfile:
    properties:
      addressId:
        type: integer
      avatarName:
        type: string
      createdAt:
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      phone:
        type: string
    type: object
host: api.balade.feldrise.com
info:
  contact: {}
  description: This is the API for balade, a diagnostic for enterpreneurs.
  title: balade API
  version: "1.0"
paths:
  /authentication/{id}:
    put:
      description: Update the current user
      operationId: update
      parameters:
      - description: user's info
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update the current user
      tags:
      - autentication
  /authentication/authenticate:
    post:
      description: Authenticate a user by sending a unique code
      operationId: authenticate
      parameters:
      - description: user's info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AuthenticatePostPayload'
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Authenticate a user
      tags:
      - autentication
  /authentication/check-email:
    get:
      description: Check if the email exists
      operationId: check-if-email-exists
      parameters:
      - description: email
        in: query
        name: email
        required: true
        type: string
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Check if the email exists
      tags:
      - autentication
  /authentication/me:
    get:
      description: Get the current user
      operationId: me
      responses:
        "200":
          description: ok
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get the current user
      tags:
      - autentication
  /authentication/users:
    get:
      description: Search users by email or name (admin only)
      operationId: search-users
      parameters:
      - description: Search term
        in: query
        name: search
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.User'
            type: array
        "401":
          description: unauthorized
          schema:
            type: string
        "403":
          description: forbidden
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Search users
      tags:
      - autentication
  /authentication/verify-authentication:
    post:
      description: Verify the authentication code
      operationId: verify-authenticate
      parameters:
      - description: user's info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/VerifyAuthenticatePostPayload'
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Verify the authentication code
      tags:
      - autentication
  /guides:
    get:
      description: Get all guides with optional active filter
      operationId: get-all-guides
      parameters:
      - description: Filter by active status (true/false)
        in: query
        name: is_active
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Guide'
            type: array
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get all Guides
    post:
      consumes:
      - application/json
      description: Create a new guide
      operationId: create-guide
      parameters:
      - description: Guide data
        in: body
        name: guide
        required: true
        schema:
          $ref: '#/definitions/GuideCreatePayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Guide'
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Create Guide
  /guides/{id}:
    delete:
      description: Delete a guide by its ID
      operationId: delete-guide
      parameters:
      - description: Guide ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete a guide
    get:
      description: Get a guide by ID
      operationId: get-guide
      parameters:
      - description: Guide ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Guide'
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get Guide
    put:
      consumes:
      - application/json
      description: Update an existing guide with the provided data
      operationId: update-guide
      parameters:
      - description: Guide ID
        in: path
        name: id
        required: true
        type: integer
      - description: Guide data
        in: body
        name: guide
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Guide'
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update an existing guide
  /guides/{id}/link-user:
    post:
      consumes:
      - application/json
      description: Link an existing guide profile to a user and grant the guide role
      operationId: link-guide-user
      parameters:
      - description: Guide ID
        in: path
        name: id
        required: true
        type: integer
      - description: User link data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/GuideLinkUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Guide'
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: not found
          schema:
            type: string
        "409":
          description: conflict
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Link a guide to a user account
  /guides/{id}/payment-config:
    put:
      consumes:
      - application/json
      description: Update payment configuration for a guide including Stripe credentials
      operationId: update-guide-payment-config
      parameters:
      - description: Guide ID
        in: path
        name: id
        required: true
        type: integer
      - description: Payment configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/GuidePaymentConfigPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update payment configuration for a guide
  /guides/me:
    get:
      description: Get the guide profile linked to the authenticated user
      operationId: get-guide-me
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Guide'
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get current user's guide profile
    put:
      consumes:
