        added to a confirmed reservation are confirmed, and payment holds the complementary
        payment of their prices when online payment is enabled. When the payment cannot
        be prepared, the participants stay added and payment_unavailable is true:
        the complement is paid later through the confirmation. The booker receives
        a summary email.'
